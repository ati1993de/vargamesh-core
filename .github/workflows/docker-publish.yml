name: Publish VargaMesh Docker Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "docker/**"
      - ".github/workflows/docker-publish.yml"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ati1993de/vargamesh-core
  VMESH_VERSION: "0.2.0"
  VMESH_SHA256: "d24087cf3dd73d6f113076fd751446041a08aaa2820bb9d409f5e4ea3696dd72"

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.VMESH_VERSION }}
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build and push VargaMesh Core
        uses: docker/build-push-action@v7
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          build-args: |
            VMESH_VERSION=${{ env.VMESH_VERSION }}
            VMESH_SHA256=${{ env.VMESH_SHA256 }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
