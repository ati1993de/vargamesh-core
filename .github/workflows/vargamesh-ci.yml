name: VargaMesh CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vargamesh-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            libevent-dev \
            libboost-dev \
            libsqlite3-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_GUI=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DENABLE_IPC=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify VargaMesh binary identity
        run: |
          build/bin/vargameshd --version
          build/bin/vargameshd --version | grep -F "VargaMesh Core"



  macos_cross:
    name: macOS ${{ matrix.arch }} reproducible cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            host: x86_64-apple-darwin
          - arch: arm64
            host: arm64-apple-darwin
    env:
      HOST: ${{ matrix.host }}
      SDK_URL: https://bitcoincore.org/depends-sources/sdks
      XCODE_VERSION: 26.1.1
      XCODE_BUILD_ID: 17B100

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install macOS cross-build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y             autoconf             automake             autotools-dev             bison             build-essential             ca-certificates             clang             cmake             curl             file             git             libtool             lld             llvm             ninja-build             patch             pkg-config             python3             xz-utils

      - name: Fetch pinned macOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_BASENAME="Xcode-$XCODE_VERSION-$XCODE_BUILD_ID-extracted-SDK-with-libcxx-headers"
          mkdir -p depends/SDKs
          curl --location --fail --retry 3             "$SDK_URL/$SDK_BASENAME.tar"             -o "$RUNNER_TEMP/$SDK_BASENAME.tar"
          tar -C depends/SDKs -xf "$RUNNER_TEMP/$SDK_BASENAME.tar"
          test -d "depends/SDKs/$SDK_BASENAME"

      - name: Build pinned macOS dependencies
        shell: bash
        run: |
          set -euxo pipefail
          make -C depends -j2             HOST="$HOST"             NO_QT=1             NO_ZMQ=1

      - name: Configure macOS release build
        shell: bash
        run: |
          set -euxo pipefail
          test -f "depends/$HOST/toolchain.cmake"
          cmake -S . -B build-macos -G Ninja             --toolchain "depends/$HOST/toolchain.cmake"             -DCMAKE_BUILD_TYPE=Release             -DBUILD_GUI=OFF             -DBUILD_TESTS=OFF             -DBUILD_BENCH=OFF             -DBUILD_FUZZ_BINARY=OFF             -DBUILD_TX=ON             -DBUILD_UTIL=ON             -DENABLE_WALLET=ON             -DBUILD_WALLET_TOOL=ON             -DWITH_ZMQ=OFF             -DENABLE_IPC=OFF             -DENABLE_EXTERNAL_SIGNER=OFF

      - name: Build macOS binaries
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-macos --parallel 2

      - name: Package macOS CI runtime
        shell: bash
        run: |
          set -euxo pipefail
          MAJOR="$(sed -n 's/^set(CLIENT_VERSION_MAJOR \([0-9][0-9]*\)).*/\1/p' CMakeLists.txt)"
          MINOR="$(sed -n 's/^set(CLIENT_VERSION_MINOR \([0-9][0-9]*\)).*/\1/p' CMakeLists.txt)"
          BUILD="$(sed -n 's/^set(CLIENT_VERSION_BUILD \([0-9][0-9]*\)).*/\1/p' CMakeLists.txt)"
          VERSION="$MAJOR.$MINOR.$BUILD"
          PKG="VargaMesh-v$VERSION-macOS-${{ matrix.arch }}"
          ROOT="dist/$PKG"
          mkdir -p "$ROOT/bin"

          for name in vargameshd vargamesh-cli vargamesh-wallet vargamesh-tx vargamesh-util; do
            src="$(find build-macos -type f -name "$name" | head -n1 || true)"
            test -n "$src" || { echo "Missing macOS binary: $name"; exit 1; }
            file "$src"
            file "$src" | grep -F "Mach-O 64-bit"
            cp -a "$src" "$ROOT/bin/$name"
          done

          cp -a COPYING "$ROOT/"
          tar -C dist -czf "dist/$PKG.tar.gz" "$PKG"
          sha256sum "dist/$PKG.tar.gz" > "dist/$PKG.tar.gz.sha256"

      - name: Upload macOS cross-build
        uses: actions/upload-artifact@v6
        with:
          name: VargaMesh-macOS-${{ matrix.arch }}-CI
          path: |
            dist/VargaMesh-*-macOS-${{ matrix.arch }}.tar.gz
            dist/VargaMesh-*-macOS-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7

  macos_smoke:
    name: macOS ${{ matrix.arch }} execution + Mainnet/Testnet smoke
    needs: [macos_cross]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64

    steps:
      - name: Download macOS cross-build
        uses: actions/download-artifact@v4
        with:
          name: VargaMesh-macOS-${{ matrix.arch }}-CI
          path: artifact

      - name: Extract macOS package
        shell: bash
        run: |
          set -euxo pipefail
          archive="$(find artifact -maxdepth 1 -type f -name 'VargaMesh-*-macOS-${{ matrix.arch }}.tar.gz' | head -n1)"
          test -n "$archive"
          mkdir -p extracted
          tar -C extracted -xzf "$archive"
          find extracted -maxdepth 3 -type f -print

      - name: Execute all packaged macOS programs
        shell: bash
        run: |
          set -euxo pipefail
          BIN="$(find extracted -type d -name bin | head -n1)"
          test -n "$BIN"
          case "${{ matrix.arch }}" in
            x86_64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "arm64" ;;
            *) exit 1 ;;
          esac

          for name in vargameshd vargamesh-cli vargamesh-wallet vargamesh-tx vargamesh-util; do
            exe="$BIN/$name"
            test -x "$exe"
            file "$exe"
            "$exe" --version
          done

      - name: macOS Mainnet + Testnet daemon/RPC smoke tests
        shell: bash
        run: |
          set -euxo pipefail
          BIN="$(find extracted -type d -name bin | head -n1)"
          D="$BIN/vargameshd"
          C="$BIN/vargamesh-cli"

          MAIN="$RUNNER_TEMP/vmesh-mainnet-smoke"
          mkdir -p "$MAIN"
          "$D" -datadir="$MAIN" -server=1 -listen=0 -connect=0 -daemonwait
          "$C" -datadir="$MAIN" getblockchaininfo > "$RUNNER_TEMP/main.json"
          grep -Eq '"chain"[[:space:]]*:[[:space:]]*"main"' "$RUNNER_TEMP/main.json"
          "$C" -datadir="$MAIN" createwallet release_smoke >/dev/null
          MAIN_ADDR="$("$C" -datadir="$MAIN" getnewaddress)"
          case "$MAIN_ADDR" in
            vm1*) ;;
            *) echo "Unexpected Mainnet address: $MAIN_ADDR"; exit 1 ;;
          esac
          "$C" -datadir="$MAIN" stop
          sleep 3

          TEST="$RUNNER_TEMP/vmesh-testnet-smoke"
          mkdir -p "$TEST"
          "$D" -testnet -datadir="$TEST" -server=1 -listen=0 -connect=0 -daemonwait
          "$C" -testnet -datadir="$TEST" getblockchaininfo > "$RUNNER_TEMP/test.json"
          grep -Eq '"chain"[[:space:]]*:[[:space:]]*"test"' "$RUNNER_TEMP/test.json"
          "$C" -testnet -datadir="$TEST" createwallet release_smoke >/dev/null
          TEST_ADDR="$("$C" -testnet -datadir="$TEST" getnewaddress)"
          case "$TEST_ADDR" in
            tvm1*) ;;
            *) echo "Unexpected Testnet address: $TEST_ADDR"; exit 1 ;;
          esac
          "$C" -testnet -datadir="$TEST" stop
          sleep 3

          echo "PASS: macOS ${{ matrix.arch }} Mainnet daemon/RPC + vm1 address"
          echo "PASS: macOS ${{ matrix.arch }} Testnet daemon/RPC + tvm1 address"


  windows:
    name: Windows headless release build
    runs-on: windows-2025
    timeout-minutes: 120

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Import Visual Studio environment
        run: py -3 .github/ci-windows.py standard github_import_vs_env

      - name: Configure Windows release build
        shell: pwsh
        run: |
          cmake -B build -Werror=dev --preset vs2026 `
            "-DVCPKG_HOST_TRIPLET=x64-windows-release" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-release" `
            "-DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON" `
            "-DVCPKG_MANIFEST_FEATURES=wallet;zeromq" `
            "-DBUILD_GUI=OFF" `
            "-DBUILD_TESTS=OFF" `
            "-DBUILD_BENCH=OFF" `
            "-DBUILD_FUZZ_BINARY=OFF" `
            "-DBUILD_TX=ON" `
            "-DBUILD_UTIL=ON" `
            "-DBUILD_WALLET_TOOL=ON" `
            "-DBUILD_KERNEL_LIB=OFF" `
            "-DBUILD_UTIL_CHAINSTATE=OFF" `
            "-DENABLE_IPC=OFF" `
            "-DWITH_ZMQ=ON"

      - name: Build VargaMesh daemon and CLI
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --target bitcoind bitcoin-cli bitcoin-wallet bitcoin-tx bitcoin-util `
            --parallel 4

      - name: Verify Windows VargaMesh binaries
        shell: pwsh
        run: |
          $daemon = Get-ChildItem `
            -Path build `
            -Filter vargameshd.exe `
            -Recurse |
            Select-Object -First 1

          $cli = Get-ChildItem `
            -Path build `
            -Filter vargamesh-cli.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $daemon) {
            throw "vargameshd.exe not found"
          }

          if (-not $cli) {
            throw "vargamesh-cli.exe not found"
          }

          Write-Host "Daemon:"
          Write-Host $daemon.FullName

          Write-Host "CLI:"
          Write-Host $cli.FullName

          $version = & $daemon.FullName --version
          $version | Write-Host

          if (($version -join "`n") -notmatch "VargaMesh Core daemon") {
            throw "Wrong daemon identity"
          }

          if (($version -join "`n") -notmatch "v0\.2\.0") {
            throw "Wrong VargaMesh version"
          }

      - name: Validate Windows manifests
        shell: pwsh
        run: |
          $files = @(
            (Get-ChildItem -Path build -Filter vargameshd.exe -Recurse | Select-Object -First 1),
            (Get-ChildItem -Path build -Filter vargamesh-cli.exe -Recurse | Select-Object -First 1)
          )

          foreach ($file in $files) {
            if (-not $file) {
              throw "Expected Windows binary missing"
            }

            Write-Host "Checking manifest: $($file.FullName)"

            & mt.exe `
              -nologo `
              "-inputresource:$($file.FullName)" `
              -validate_manifest

            if ($LASTEXITCODE -ne 0) {
              throw "Manifest validation failed: $($file.FullName)"
            }
          }

      - name: Package Windows runtime
        shell: pwsh
        run: |
          $release = "build/bin/Release"
          $vcpkg = "build/vcpkg_installed/x64-windows-release/bin"

          $packageRoot = "dist/VargaMesh-v0.2.0-windows-x86_64"

          New-Item -ItemType Directory `
            -Force `
            -Path $packageRoot | Out-Null

          $executables = @(
            "vargameshd.exe",
            "vargamesh-cli.exe",
            "vargamesh-wallet.exe",
            "vargamesh-tx.exe",
            "vargamesh-util.exe"
          )

          foreach ($exe in $executables) {
            $src = Join-Path $release $exe

            if (-not (Test-Path $src)) {
              throw "Expected Windows binary missing: $exe"
            }

            Copy-Item $src $packageRoot -Force
          }

          # vcpkg normally deploys required DLLs next to the executables.
          # Copy those first.
          Get-ChildItem `
            -Path $release `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item $_.FullName $packageRoot -Force
            }

          # Also collect all target-triplet release DLLs.
          # This prevents an incomplete package if AppLocal omitted one.
          if (Test-Path $vcpkg) {
            Get-ChildItem `
              -Path $vcpkg `
              -Filter "*.dll" `
              -File |
              ForEach-Object {
                Copy-Item $_.FullName $packageRoot -Force
              }
          }

          Write-Host ""
          Write-Host "===== WINDOWS RUNTIME PACKAGE ====="

          Get-ChildItem $packageRoot |
            Sort-Object Name |
            Format-Table Name,Length

      - name: Verify packaged Windows runtime
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path `
            "dist/VargaMesh-v0.2.0-windows-x86_64"

          $daemon = Join-Path `
            $packageRoot `
            "vargameshd.exe"

          $cli = Join-Path `
            $packageRoot `
            "vargamesh-cli.exe"

          if (-not (Test-Path $daemon)) {
            throw "Packaged vargameshd.exe missing"
          }

          if (-not (Test-Path $cli)) {
            throw "Packaged vargamesh-cli.exe missing"
          }

          # Remove vcpkg/Visual Studio directories from PATH so this test
          # proves that the package itself contains its runtime DLLs.
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          try {
            Write-Host ""
            Write-Host "===== DAEMON VERSION ====="

            $daemonVersion = & $daemon --version

            if ($LASTEXITCODE -ne 0) {
              throw "Packaged vargameshd.exe failed"
            }

            $daemonVersion | Write-Host

            if (($daemonVersion -join "`n") -notmatch "VargaMesh Core daemon") {
              throw "Wrong daemon identity"
            }

            if (($daemonVersion -join "`n") -notmatch "v0\.2\.0") {
              throw "Wrong daemon version"
            }

            Write-Host ""
            Write-Host "===== CLI VERSION ====="

            $cliVersion = & $cli --version

            if ($LASTEXITCODE -ne 0) {
              throw "Packaged vargamesh-cli.exe failed"
            }

            $cliVersion | Write-Host

            if (($cliVersion -join "`n") -notmatch "VargaMesh Core") {
              throw "Wrong CLI identity"
            }
          }
          finally {
            $env:PATH = $oldPath
          }

          Write-Host ""
          Write-Host "WINDOWS RUNTIME VERIFY: PASS"

      - name: Create Windows release archive
        shell: pwsh
        run: |
          $folder = "dist/VargaMesh-v0.2.0-windows-x86_64"
          $zip = "dist/VargaMesh-v0.2.0-windows-x86_64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$folder/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          $hash = Get-FileHash `
            -Algorithm SHA256 `
            $zip

          "$($hash.Hash.ToLower())  VargaMesh-v0.2.0-windows-x86_64.zip" |
            Set-Content `
              -Encoding ascii `
              "dist/VargaMesh-v0.2.0-windows-x86_64.zip.sha256"

          Write-Host ""
          Write-Host "===== SHA256 ====="

          Get-Content `
            "dist/VargaMesh-v0.2.0-windows-x86_64.zip.sha256"

      - name: Upload Windows CI package
        uses: actions/upload-artifact@v6
        with:
          name: VargaMesh-Windows-x86_64-CI
          path: |
            dist/VargaMesh-v0.2.0-windows-x86_64.zip
            dist/VargaMesh-v0.2.0-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 7
