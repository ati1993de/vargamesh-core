name: VargaMesh CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: vargamesh-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux build and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            python3 \
            libevent-dev \
            libboost-dev \
            libsqlite3-dev

      - name: Configure
        run: |
          cmake -S . -B build -G Ninja \
            -DBUILD_GUI=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DENABLE_IPC=OFF

      - name: Build
        run: cmake --build build --parallel 2

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Verify VargaMesh binary identity
        run: |
          build/bin/vargameshd --version
          build/bin/vargameshd --version | grep -F "VargaMesh Core"

  windows:
    name: Windows headless release build
    runs-on: windows-2025
    timeout-minutes: 120

    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Import Visual Studio environment
        run: py -3 .github/ci-windows.py standard github_import_vs_env

      - name: Configure Windows release build
        shell: pwsh
        run: |
          cmake -B build -Werror=dev --preset vs2026 `
            "-DVCPKG_HOST_TRIPLET=x64-windows-release" `
            "-DVCPKG_TARGET_TRIPLET=x64-windows-release" `
            "-DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON" `
            "-DVCPKG_MANIFEST_FEATURES=wallet;zeromq" `
            "-DBUILD_GUI=OFF" `
            "-DBUILD_TESTS=OFF" `
            "-DBUILD_BENCH=OFF" `
            "-DBUILD_FUZZ_BINARY=OFF" `
            "-DBUILD_KERNEL_LIB=OFF" `
            "-DBUILD_UTIL_CHAINSTATE=OFF" `
            "-DENABLE_IPC=OFF" `
            "-DWITH_ZMQ=ON"

      - name: Build VargaMesh daemon and CLI
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --target bitcoind bitcoin-cli `
            --parallel 4

      - name: Verify Windows VargaMesh binaries
        shell: pwsh
        run: |
          $daemon = Get-ChildItem `
            -Path build `
            -Filter vargameshd.exe `
            -Recurse |
            Select-Object -First 1

          $cli = Get-ChildItem `
            -Path build `
            -Filter vargamesh-cli.exe `
            -Recurse |
            Select-Object -First 1

          if (-not $daemon) {
            throw "vargameshd.exe not found"
          }

          if (-not $cli) {
            throw "vargamesh-cli.exe not found"
          }

          Write-Host "Daemon:"
          Write-Host $daemon.FullName

          Write-Host "CLI:"
          Write-Host $cli.FullName

          $version = & $daemon.FullName --version
          $version | Write-Host

          if (($version -join "`n") -notmatch "VargaMesh Core daemon") {
            throw "Wrong daemon identity"
          }

          if (($version -join "`n") -notmatch "v0\.1\.0") {
            throw "Wrong VargaMesh version"
          }

      - name: Validate Windows manifests
        shell: pwsh
        run: |
          $files = @(
            (Get-ChildItem -Path build -Filter vargameshd.exe -Recurse | Select-Object -First 1),
            (Get-ChildItem -Path build -Filter vargamesh-cli.exe -Recurse | Select-Object -First 1)
          )

          foreach ($file in $files) {
            if (-not $file) {
              throw "Expected Windows binary missing"
            }

            Write-Host "Checking manifest: $($file.FullName)"

            & mt.exe `
              -nologo `
              "-inputresource:$($file.FullName)" `
              -validate_manifest

            if ($LASTEXITCODE -ne 0) {
              throw "Manifest validation failed: $($file.FullName)"
            }
          }

      - name: Package Windows runtime
        shell: pwsh
        run: |
          $release = "build/bin/Release"
          $vcpkg = "build/vcpkg_installed/x64-windows-release/bin"

          $packageRoot = "dist/VargaMesh-v0.1.0-windows-x86_64"

          New-Item -ItemType Directory `
            -Force `
            -Path $packageRoot | Out-Null

          Copy-Item `
            "$release/vargameshd.exe" `
            $packageRoot

          Copy-Item `
            "$release/vargamesh-cli.exe" `
            $packageRoot

          # vcpkg normally deploys required DLLs next to the executables.
          # Copy those first.
          Get-ChildItem `
            -Path $release `
            -Filter "*.dll" `
            -File `
            -ErrorAction SilentlyContinue |
            ForEach-Object {
              Copy-Item $_.FullName $packageRoot -Force
            }

          # Also collect all target-triplet release DLLs.
          # This prevents an incomplete package if AppLocal omitted one.
          if (Test-Path $vcpkg) {
            Get-ChildItem `
              -Path $vcpkg `
              -Filter "*.dll" `
              -File |
              ForEach-Object {
                Copy-Item $_.FullName $packageRoot -Force
              }
          }

          Write-Host ""
          Write-Host "===== WINDOWS RUNTIME PACKAGE ====="

          Get-ChildItem $packageRoot |
            Sort-Object Name |
            Format-Table Name,Length

      - name: Verify packaged Windows runtime
        shell: pwsh
        run: |
          $packageRoot = Resolve-Path `
            "dist/VargaMesh-v0.1.0-windows-x86_64"

          $daemon = Join-Path `
            $packageRoot `
            "vargameshd.exe"

          $cli = Join-Path `
            $packageRoot `
            "vargamesh-cli.exe"

          if (-not (Test-Path $daemon)) {
            throw "Packaged vargameshd.exe missing"
          }

          if (-not (Test-Path $cli)) {
            throw "Packaged vargamesh-cli.exe missing"
          }

          # Remove vcpkg/Visual Studio directories from PATH so this test
          # proves that the package itself contains its runtime DLLs.
          $oldPath = $env:PATH
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"

          try {
            Write-Host ""
            Write-Host "===== DAEMON VERSION ====="

            $daemonVersion = & $daemon --version

            if ($LASTEXITCODE -ne 0) {
              throw "Packaged vargameshd.exe failed"
            }

            $daemonVersion | Write-Host

            if (($daemonVersion -join "`n") -notmatch "VargaMesh Core daemon") {
              throw "Wrong daemon identity"
            }

            if (($daemonVersion -join "`n") -notmatch "v0\.1\.0") {
              throw "Wrong daemon version"
            }

            Write-Host ""
            Write-Host "===== CLI VERSION ====="

            $cliVersion = & $cli --version

            if ($LASTEXITCODE -ne 0) {
              throw "Packaged vargamesh-cli.exe failed"
            }

            $cliVersion | Write-Host

            if (($cliVersion -join "`n") -notmatch "VargaMesh Core") {
              throw "Wrong CLI identity"
            }
          }
          finally {
            $env:PATH = $oldPath
          }

          Write-Host ""
          Write-Host "WINDOWS RUNTIME VERIFY: PASS"

      - name: Create Windows release archive
        shell: pwsh
        run: |
          $folder = "dist/VargaMesh-v0.1.0-windows-x86_64"
          $zip = "dist/VargaMesh-v0.1.0-windows-x86_64.zip"

          if (Test-Path $zip) {
            Remove-Item $zip -Force
          }

          Compress-Archive `
            -Path "$folder/*" `
            -DestinationPath $zip `
            -CompressionLevel Optimal

          $hash = Get-FileHash `
            -Algorithm SHA256 `
            $zip

          "$($hash.Hash.ToLower())  VargaMesh-v0.1.0-windows-x86_64.zip" |
            Set-Content `
              -Encoding ascii `
              "dist/VargaMesh-v0.1.0-windows-x86_64.zip.sha256"

          Write-Host ""
          Write-Host "===== SHA256 ====="

          Get-Content `
            "dist/VargaMesh-v0.1.0-windows-x86_64.zip.sha256"

      - name: Upload Windows CI package
        uses: actions/upload-artifact@v6
        with:
          name: VargaMesh-Windows-x86_64-CI
          path: |
            dist/VargaMesh-v0.1.0-windows-x86_64.zip
            dist/VargaMesh-v0.1.0-windows-x86_64.zip.sha256
          if-no-files-found: error
          retention-days: 7
