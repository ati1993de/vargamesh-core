name: macOS VargaMesh Core binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing or planned VargaMesh Core release tag
        required: true
        default: v0.2.0
        type: string
      commit:
        description: Exact commit SHA to build
        required: true
        type: string
      publish:
        description: Attach verified macOS archives to an existing GitHub Release
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: vargamesh-core-macos-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: macOS ${{ matrix.arch }} reproducible cross-build
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            host: x86_64-apple-darwin
          - arch: arm64
            host: arm64-apple-darwin
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}
      HOST: ${{ matrix.host }}
      SDK_URL: https://bitcoincore.org/depends-sources/sdks
      XCODE_VERSION: 26.1.1
      XCODE_BUILD_ID: 17B100

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify source and tag version
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          VERSION="${RELEASE_TAG#v}"
          MAJOR="$(sed -n 's/^set(CLIENT_VERSION_MAJOR \([0-9][0-9]*\)).*/\1/p' CMakeLists.txt)"
          MINOR="$(sed -n 's/^set(CLIENT_VERSION_MINOR \([0-9][0-9]*\)).*/\1/p' CMakeLists.txt)"
          BUILD="$(sed -n 's/^set(CLIENT_VERSION_BUILD \([0-9][0-9]*\)).*/\1/p' CMakeLists.txt)"
          test "$VERSION" = "$MAJOR.$MINOR.$BUILD"
          grep -q 'set(CLIENT_VERSION_IS_RELEASE "true")' CMakeLists.txt
          test -f doc/testnet.md

      - name: Install macOS cross-build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf \
            automake \
            autotools-dev \
            bison \
            build-essential \
            ca-certificates \
            clang \
            cmake \
            curl \
            file \
            git \
            libtool \
            lld \
            llvm \
            ninja-build \
            patch \
            pkg-config \
            python3 \
            xz-utils

      - name: Fetch pinned macOS SDK
        shell: bash
        run: |
          set -euxo pipefail
          SDK_BASENAME="Xcode-$XCODE_VERSION-$XCODE_BUILD_ID-extracted-SDK-with-libcxx-headers"
          mkdir -p depends/SDKs
          curl --location --fail --retry 3 \
            "$SDK_URL/$SDK_BASENAME.tar" \
            -o "$RUNNER_TEMP/$SDK_BASENAME.tar"
          tar -C depends/SDKs -xf "$RUNNER_TEMP/$SDK_BASENAME.tar"
          test -d "depends/SDKs/$SDK_BASENAME"

      - name: Build pinned macOS dependencies
        shell: bash
        run: |
          set -euxo pipefail
          make -C depends -j2 \
            HOST="$HOST" \
            NO_QT=1 \
            NO_ZMQ=1

      - name: Configure macOS release
        shell: bash
        run: |
          set -euxo pipefail
          test -f "depends/$HOST/toolchain.cmake"
          cmake -S . -B build-macos -G Ninja \
            --toolchain "depends/$HOST/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_TX=ON \
            -DBUILD_UTIL=ON \
            -DENABLE_WALLET=ON \
            -DBUILD_WALLET_TOOL=ON \
            -DWITH_ZMQ=OFF \
            -DENABLE_IPC=OFF \
            -DENABLE_EXTERNAL_SIGNER=OFF

      - name: Build macOS binaries
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build-macos --parallel 2

      - name: Package macOS binaries
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${RELEASE_TAG#v}"
          PKG="vargamesh-core-${VERSION}-macos-${{ matrix.arch }}"
          ROOT="package/$PKG"
          mkdir -p "$ROOT/bin"

          find_required() {
            local name="$1"
            local path
            path="$(find build-macos -type f -name "$name" | head -n1 || true)"
            test -n "$path" || { echo "Missing required macOS binary: $name"; exit 1; }
            echo "$path"
          }

          for name in vargameshd vargamesh-cli vargamesh-wallet vargamesh-tx vargamesh-util; do
            src="$(find_required "$name")"
            file "$src"
            file "$src" | grep -F "Mach-O 64-bit"
            cp -a "$src" "$ROOT/bin/$name"
          done

          cp -a COPYING "$ROOT/"
          cp -a README.md "$ROOT/"
          cp -a doc/testnet.md "$ROOT/TESTNET.md"
          cp -a doc/exchange-integration.md "$ROOT/EXCHANGE-INTEGRATION.md"

          NOTES="doc/release-notes/release-notes-${RELEASE_TAG}.md"
          if [ -f "$NOTES" ]; then cp -a "$NOTES" "$ROOT/RELEASE-NOTES.md"; fi

          tar -C package -czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "macos-${{ matrix.arch }}.sha256"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: |
            vargamesh-core-*-macos-${{ matrix.arch }}.tar.gz
            macos-${{ matrix.arch }}.sha256
          if-no-files-found: error
          retention-days: 7

  smoke:
    name: macOS ${{ matrix.arch }} execution + Mainnet/Testnet smoke
    needs: [build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x86_64
          - runner: macos-15
            arch: arm64
    env:
      RELEASE_TAG: ${{ inputs.tag }}

    steps:
      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          path: artifact

      - name: Extract package
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${RELEASE_TAG#v}"
          ARCHIVE="artifact/vargamesh-core-${VERSION}-macos-${{ matrix.arch }}.tar.gz"
          test -s "$ARCHIVE"
          mkdir -p extracted
          tar -C extracted -xzf "$ARCHIVE"
          test -d "extracted/vargamesh-core-${VERSION}-macos-${{ matrix.arch }}/bin"

      - name: Execute all packaged macOS programs
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${RELEASE_TAG#v}"
          BIN="extracted/vargamesh-core-${VERSION}-macos-${{ matrix.arch }}/bin"
          case "${{ matrix.arch }}" in
            x86_64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "arm64" ;;
            *) exit 1 ;;
          esac
          for name in vargameshd vargamesh-cli vargamesh-wallet vargamesh-tx vargamesh-util; do
            exe="$BIN/$name"
            test -x "$exe"
            file "$exe"
            "$exe" --version
          done

      - name: Mainnet + Testnet daemon/RPC smoke tests
        shell: bash
        run: |
          set -euxo pipefail
          VERSION="${RELEASE_TAG#v}"
          BIN="extracted/vargamesh-core-${VERSION}-macos-${{ matrix.arch }}/bin"
          D="$BIN/vargameshd"
          C="$BIN/vargamesh-cli"

          MAIN="$RUNNER_TEMP/vmesh-mainnet-smoke"
          mkdir -p "$MAIN"
          "$D" -datadir="$MAIN" -server=1 -listen=0 -connect=0 -daemonwait
          "$C" -datadir="$MAIN" getblockchaininfo > "$RUNNER_TEMP/main.json"
          grep -Eq '"chain"[[:space:]]*:[[:space:]]*"main"' "$RUNNER_TEMP/main.json"
          "$C" -datadir="$MAIN" createwallet release_smoke >/dev/null
          MAIN_ADDR="$("$C" -datadir="$MAIN" getnewaddress)"
          case "$MAIN_ADDR" in vm1*) ;; *) echo "Unexpected Mainnet address: $MAIN_ADDR"; exit 1 ;; esac
          "$C" -datadir="$MAIN" stop
          sleep 3

          TEST="$RUNNER_TEMP/vmesh-testnet-smoke"
          mkdir -p "$TEST"
          "$D" -testnet -datadir="$TEST" -server=1 -listen=0 -connect=0 -daemonwait
          "$C" -testnet -datadir="$TEST" getblockchaininfo > "$RUNNER_TEMP/test.json"
          grep -Eq '"chain"[[:space:]]*:[[:space:]]*"test"' "$RUNNER_TEMP/test.json"
          "$C" -testnet -datadir="$TEST" createwallet release_smoke >/dev/null
          TEST_ADDR="$("$C" -testnet -datadir="$TEST" getnewaddress)"
          case "$TEST_ADDR" in tvm1*) ;; *) echo "Unexpected Testnet address: $TEST_ADDR"; exit 1 ;; esac
          "$C" -testnet -datadir="$TEST" stop
          sleep 3

          echo "PASS: macOS ${{ matrix.arch }} Mainnet daemon/RPC + vm1 address"
          echo "PASS: macOS ${{ matrix.arch }} Testnet daemon/RPC + tvm1 address"

  publish:
    name: Attach verified macOS assets to existing release
    if: ${{ inputs.publish }}
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      RELEASE_COMMIT: ${{ inputs.commit }}

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download Intel artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-x86_64
          path: artifacts

      - name: Download Apple Silicon artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-arm64
          path: artifacts

      - name: Verify release target and checksums
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_COMMIT"
          VERSION="${RELEASE_TAG#v}"
          X64="artifacts/vargamesh-core-${VERSION}-macos-x86_64.tar.gz"
          ARM64="artifacts/vargamesh-core-${VERSION}-macos-arm64.tar.gz"
          test -s "$X64"
          test -s "$ARM64"
          git fetch --force origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
          test "$(git rev-list -n1 "$RELEASE_TAG")" = "$RELEASE_COMMIT"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null
          (cd artifacts && sha256sum "vargamesh-core-${VERSION}-macos-x86_64.tar.gz" "vargamesh-core-${VERSION}-macos-arm64.tar.gz" > SHA256SUMS-macOS)
          cat artifacts/SHA256SUMS-macOS

      - name: Upload macOS release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          VERSION="${RELEASE_TAG#v}"
          gh release upload "$RELEASE_TAG" \
            "artifacts/vargamesh-core-${VERSION}-macos-x86_64.tar.gz" \
            "artifacts/vargamesh-core-${VERSION}-macos-arm64.tar.gz" \
            "artifacts/SHA256SUMS-macOS" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify published assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,url,assets \
            --jq '{tag:.tagName,url:.url,assets:[.assets[].name]}'
