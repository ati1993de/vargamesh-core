name: Release Linux + Windows binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing VargaMesh release tag to build
        required: true
        default: v0.1.1
        type: string

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  linux:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}
      HOST: x86_64-pc-linux-gnu

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify version/tag
        shell: bash
        run: |
          set -euxo pipefail
          test "$(git describe --tags --exact-match)" = "$TAG"
          grep -q 'set(CLIENT_VERSION_MAJOR 0)' CMakeLists.txt
          grep -q 'set(CLIENT_VERSION_MINOR 1)' CMakeLists.txt
          grep -q 'set(CLIENT_VERSION_BUILD 1)' CMakeLists.txt
          grep -q 'set(CLIENT_VERSION_IS_RELEASE "true")' CMakeLists.txt

      - name: Install Linux build prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            automake \
            autotools-dev \
            binutils \
            bison \
            ca-certificates \
            cmake \
            curl \
            file \
            git \
            libtool \
            ninja-build \
            patch \
            pkg-config \
            python3

      - name: Build pinned depends
        shell: bash
        run: |
          set -euxo pipefail
          make -C depends -j2 \
            HOST="$HOST" \
            NO_QT=1 \
            NO_ZMQ=1 \
            NO_NATPMP=1 \
            NO_UPNP=1

      - name: Configure release
        shell: bash
        run: |
          set -euxo pipefail
          cmake -S . -B build -G Ninja \
            --toolchain "depends/$HOST/toolchain.cmake" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GUI=OFF \
            -DBUILD_TESTS=OFF \
            -DBUILD_BENCH=OFF \
            -DBUILD_FUZZ_BINARY=OFF \
            -DBUILD_TX=ON \
            -DBUILD_UTIL=ON \
            -DENABLE_WALLET=ON \
            -DBUILD_WALLET_TOOL=ON \
            -DWITH_ZMQ=OFF \
            -DENABLE_IPC=OFF \
            -DENABLE_EXTERNAL_SIGNER=OFF

      - name: Build
        shell: bash
        run: |
          set -euxo pipefail
          cmake --build build --parallel 2

      - name: Collect and smoke-test Linux binaries
        shell: bash
        run: |
          set -euxo pipefail

          VERSION="${TAG#v}"
          ROOT="package/vargamesh-core-${VERSION}-linux-x86_64"
          mkdir -p "$ROOT/bin"

          find_one() {
            local name="$1"
            local p
            p="$(find build -type f -name "$name" -perm -111 | head -n1 || true)"
            test -n "$p" || { echo "Missing required binary: $name"; exit 1; }
            echo "$p"
          }

          for name in vargameshd vargamesh-cli vargamesh-wallet vargamesh-tx vargamesh-util; do
            p="$(find_one "$name")"
            cp -a "$p" "$ROOT/bin/$name"
            "$ROOT/bin/$name" --version
            "$ROOT/bin/$name" --version | grep -Eq '0\.1\.1|v0\.1\.1'
          done

          optional="$(find build -type f -name vargamesh -perm -111 | head -n1 || true)"
          if [ -n "$optional" ]; then
            cp -a "$optional" "$ROOT/bin/vargamesh"
            "$ROOT/bin/vargamesh" --version || true
          fi

          cp -a COPYING "$ROOT/" 2>/dev/null || true
          cp -a README.md "$ROOT/" 2>/dev/null || cp -a README "$ROOT/" 2>/dev/null || true

          echo "===== FILE ====="
          file "$ROOT"/bin/*

          echo "===== LDD ====="
          for f in "$ROOT"/bin/*; do
            echo "--- $f"
            ldd "$f" || true
          done

          tar -C package -czf "vargamesh-core-${VERSION}-linux-x86_64.tar.gz" \
            "vargamesh-core-${VERSION}-linux-x86_64"

          sha256sum "vargamesh-core-${VERSION}-linux-x86_64.tar.gz" \
            > linux.sha256

      - name: Upload Linux build artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: |
            vargamesh-core-*-linux-x86_64.tar.gz
            linux.sha256
          if-no-files-found: error
          retention-days: 7

  windows:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      TAG: ${{ inputs.tag }}

    steps:
      - name: Checkout exact release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify version/tag
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = git describe --tags --exact-match
          if ($actual.Trim() -ne $env:TAG) { throw "Wrong tag: $actual" }

          $cmake = Get-Content CMakeLists.txt -Raw
          if ($cmake -notmatch 'set\(CLIENT_VERSION_MAJOR 0\)') { throw "Wrong major" }
          if ($cmake -notmatch 'set\(CLIENT_VERSION_MINOR 1\)') { throw "Wrong minor" }
          if ($cmake -notmatch 'set\(CLIENT_VERSION_BUILD 1\)') { throw "Wrong build" }
          if ($cmake -notmatch 'set\(CLIENT_VERSION_IS_RELEASE "true"\)') { throw "Not release build" }

      - name: Configure MSVC + static vcpkg
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if (-not $env:VCPKG_INSTALLATION_ROOT) {
            throw "VCPKG_INSTALLATION_ROOT is not available on runner"
          }

          $toolchain = Join-Path $env:VCPKG_INSTALLATION_ROOT "scripts/buildsystems/vcpkg.cmake"

          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$toolchain" `
            -DVCPKG_TARGET_TRIPLET=x64-windows-static `
            -DVCPKG_MANIFEST_NO_DEFAULT_FEATURES=ON `
            "-DVCPKG_MANIFEST_FEATURES=wallet" `
            -DBUILD_GUI=OFF `
            -DBUILD_TESTS=OFF `
            -DBUILD_BENCH=OFF `
            -DBUILD_FUZZ_BINARY=OFF `
            -DBUILD_TX=ON `
            -DBUILD_UTIL=ON `
            -DENABLE_WALLET=ON `
            -DBUILD_WALLET_TOOL=ON `
            -DWITH_ZMQ=OFF `
            -DENABLE_IPC=OFF `
            -DENABLE_EXTERNAL_SIGNER=OFF

      - name: Build Windows Release
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cmake --build build --config Release --parallel 2

      - name: Collect and smoke-test Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $version = $env:TAG.TrimStart("v")
          $root = "package\vargamesh-core-$version-windows-x86_64"
          $bin = Join-Path $root "bin"
          New-Item -ItemType Directory -Force -Path $bin | Out-Null

          $required = @(
            "vargameshd.exe",
            "vargamesh-cli.exe",
            "vargamesh-wallet.exe",
            "vargamesh-tx.exe",
            "vargamesh-util.exe"
          )

          foreach ($name in $required) {
            $matches = @(Get-ChildItem -Path build -Recurse -File -Filter $name)
            if ($matches.Count -lt 1) { throw "Missing required binary: $name" }
            $src = $matches[0].FullName
            Copy-Item $src (Join-Path $bin $name)
          }

          $optional = @(Get-ChildItem -Path build -Recurse -File -Filter "vargamesh.exe")
          if ($optional.Count -gt 0) {
            Copy-Item $optional[0].FullName (Join-Path $bin "vargamesh.exe")
          }

          foreach ($exe in Get-ChildItem $bin -Filter "*.exe") {
            Write-Host "===== $($exe.Name) ====="
            & $exe.FullName --version
            if ($LASTEXITCODE -ne 0) { throw "$($exe.Name) --version failed" }
          }

          if (Test-Path COPYING) { Copy-Item COPYING $root }
          if (Test-Path README.md) { Copy-Item README.md $root }
          elseif (Test-Path README) { Copy-Item README $root }

          Compress-Archive -Path $root -DestinationPath "vargamesh-core-$version-windows-x86_64.zip" -CompressionLevel Optimal

          $hash = (Get-FileHash "vargamesh-core-$version-windows-x86_64.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  vargamesh-core-$version-windows-x86_64.zip" | Set-Content -NoNewline windows.sha256

      - name: Upload Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64
          path: |
            vargamesh-core-*-windows-x86_64.zip
            windows.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish assets to existing GitHub release
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Validate artifacts and build SHA256SUMS
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euxo pipefail
          VERSION="${TAG#v}"

          test -s "artifacts/vargamesh-core-${VERSION}-linux-x86_64.tar.gz"
          test -s "artifacts/vargamesh-core-${VERSION}-windows-x86_64.zip"

          cd artifacts
          sha256sum \
            "vargamesh-core-${VERSION}-linux-x86_64.tar.gz" \
            "vargamesh-core-${VERSION}-windows-x86_64.zip" \
            > SHA256SUMS

          cat SHA256SUMS

      - name: Verify existing GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euxo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY"

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euxo pipefail
          VERSION="${TAG#v}"

          gh release upload "$TAG" \
            "artifacts/vargamesh-core-${VERSION}-linux-x86_64.tar.gz" \
            "artifacts/vargamesh-core-${VERSION}-windows-x86_64.zip" \
            "artifacts/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Final release verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euxo pipefail
          gh release view "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --json tagName,name,url,assets \
            --jq '{tag:.tagName,name:.name,url:.url,assets:[.assets[].name]}'
