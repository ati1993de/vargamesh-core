name: Bug report
description: Report a reproducible VargaMesh Core problem
title: "[bug] "
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here. See SECURITY.md.

  - type: input
    id: version
    attributes:
      label: VargaMesh Core version
      placeholder: "v0.1.0 or commit hash"
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What happened?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Steps required to reproduce the issue.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture and relevant configuration.
