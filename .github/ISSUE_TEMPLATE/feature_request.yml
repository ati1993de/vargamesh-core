name: Feature request
description: Suggest a VargaMesh Core improvement
title: "[feature] "
body:
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: What problem would this solve?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: textarea
    id: consensus
    attributes:
      label: Consensus impact
      description: Explain whether the proposal changes consensus, P2P or serialization.
